{% extends 'catalog/base.html' %}
{% load static %}

{% block title %}Регистрация{% endblock %}

{% block content_1 %}{% include 'catalog/main_menu.html' %}{% endblock %}

{% block content %}
<style>
    .registration-form {
        max-width: 500px;
        margin: 0 auto;
        padding: 20px;
    }
    .registration-form h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }
    .registration-form p {
        margin-bottom: 15px;
    }
    .registration-form label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
    }
    .registration-form input[type="text"],
    .registration-form input[type="email"],
    .registration-form input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
    }
    .registration-form .help-text {
        font-size: 13px;
        color: #666;
        margin-top: 5px;
    }
    .registration-form button {
        width: 100%;
        padding: 12px;
        background-color: #28a745; /* зелёный, как у вас в предпочтениях */
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }
    .registration-form button:hover {
        background-color: #218838;
    }
</style>

<div class="registration-form">
    <h2>Регистрация</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </form>
</div>

{% endblock %}
