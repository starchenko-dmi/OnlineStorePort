{% extends 'catalog/base.html' %}
{% block title %}Удаление записи{% endblock %}
{% block content_1 %}{% include 'catalog/main_menu.html' %}{% endblock %}
{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <h2>Удалить запись "{{ object.title }}"?</h2>
        <p class="text-muted">Это действие нельзя отменить.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
